<div class="video-player-container">
  <div class="video-canvas-container">
    <canvas #canvas class="video-canvas" aria-label="Player de vídeo" role="img"></canvas>
  </div>
  <div class="controls-container">
    <div class="progress-bar-container">
      <input
      type="range"
      class="progress-bar"
      [min]="playableStartTime()"
      [max]="playableEndTime()"
      [value]="currentTime()"
      [attr.aria-valuenow]="currentTime()"
      [attr.aria-valuemin]="playableStartTime()"
      [attr.aria-valuemax]="playableEndTime()"
      [attr.aria-valuetext]="formatTime(currentTime())"
      [disabled]="!isLoaded()"
      step="0.05"
      (mousedown)="onScrubStart()"
      (touchstart)="onScrubStart()"
      (keydown)="onScrubStart()"
      (input)="onProgressChange($event)"
      (change)="onScrubEnd()"
      (mouseup)="onScrubEnd()"
      (touchend)="onScrubEnd()"
      (keyup)="onScrubEnd()"
      aria-label="Progresso do vídeo"
      >
    </div>
    <div class="buttons-container">
      <button
      type="button"
      (click)="seek(-1)"
      [disabled]="!isLoaded()"
      aria-label="Voltar 1 segundo"
      title="Voltar 1 segundo"
      class="control-button"
      >
        <ng-container *ngTemplateOutlet="backwardOneSecondIcon"></ng-container>
      </button>
      <button
      type="button"
      (click)="stepFrame('backward')"
      [disabled]="!isLoaded()"
      aria-label="Voltar 1 frame"
      title="Voltar 1 frame"
      class="control-button"
      >
        <ng-container *ngTemplateOutlet="backwardOneFrameIcon"></ng-container>
      </button>
      <button
      type="button"
      (click)="togglePlay()"
      [disabled]="!isLoaded()"
      [attr.aria-label]="isPlaying() ? 'Pausar' : 'Reproduzir'"
      [title]="isPlaying() ? 'Pausar' : 'Reproduzir'"
      class="control-button"
      >
        @if (isPlaying()) {
          <ng-container *ngTemplateOutlet="pauseIcon"></ng-container>
        } @else {
          <ng-container *ngTemplateOutlet="playIcon"></ng-container>
        }
      </button>
      <button
      type="button"
      (click)="stepFrame('forward')"
      [disabled]="!isLoaded()"
      aria-label="Avançar 1 frame"
      title="Avançar 1 frame"
      class="control-button"
      >
        <ng-container *ngTemplateOutlet="advanceOneFrameIcon"></ng-container>
      </button>
      <button
      type="button"
      (click)="seek(1)"
      [disabled]="!isLoaded()"
      aria-label="Avançar 1 segundo"
      title="Avançar 1 segundo"
      class="control-button"
      >
        <ng-container *ngTemplateOutlet="advanceOneSecondIcon"></ng-container>
      </button>
    </div>
  </div>
</div>
<ng-template #backwardOneSecondIcon>
  <svg aria-hidden="true" class="icon" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <path style="fill:currentColor" d="M 20,6 11.431111,12 20,18 Z" />
    <path style="fill:currentColor" d="M 2.5,12 11.068888,6 v 12 z" />
  </svg>
</ng-template>
<ng-template #backwardOneFrameIcon>
  <svg aria-hidden="true" class="icon" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <path style="fill:currentColor" d="M 8,12 14,6 V 18 Z" />
  </svg>
</ng-template>
<ng-template #pauseIcon>
  <svg aria-hidden="true" class="icon" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <path style="fill:none;stroke:currentColor;stroke-width:4" d="M 8,5 V 19" />
    <path style="fill:none;stroke:currentColor;stroke-width:4" d="M 16,5 V 19" />
  </svg>
</ng-template>
<ng-template #playIcon>
  <svg aria-hidden="true" class="icon" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <path style="fill:currentColor" d="M 8,5 19,12 8,19 Z" />
  </svg>
</ng-template>
<ng-template #advanceOneFrameIcon>
  <svg aria-hidden="true" class="icon" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <path style="fill:currentColor" d="m 10,6 6,6 -6,6 z" />
  </svg>
</ng-template>
<ng-template #advanceOneSecondIcon>
  <svg aria-hidden="true" class="icon" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <path style="fill:currentColor;fill-opacity:1;stroke:none;stroke-width:2;stroke-linejoin:round;stroke-dashoffset:9.99999" d="M 4,6 12.568888,12 4,18 Z" />
    <path style="fill:currentColor" d="M 21.5,12 12.931112,6 v 12 z" />
  </svg>
</ng-template>
