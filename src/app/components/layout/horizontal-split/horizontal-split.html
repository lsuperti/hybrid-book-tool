<div
#splitContainer
class="split-container"
[style.--left-width.%]="collapsed() === 'left' ? 0 : collapsed() === 'right' ? 100 : leftWidth()"
>
  @if (collapsed() === 'right' || collapsed() === 'none') {
    <div class="left-area">
      <ng-content select="[left]"></ng-content>
    </div>
  }

  @if (collapsed() === 'none') {
    <div
    class="resize-bar"
    [style.--top-margin]="resizeBarTopMargin()"
    [style.--bottom-margin]="resizeBarBottomMargin()"
    (pointerdown)="resizeBarPointerDown($event)"
    (keydown)="resizeBarKeyDown($event)"
    role="separator"
    aria-orientation="vertical"
    [attr.aria-valuemin]="minWidthPercentage()"
    [attr.aria-valuemax]="100 - minWidthPercentage()"
    [attr.aria-valuenow]="leftWidth()"
    [attr.aria-label]="resizeBarAriaLabel()"
    tabindex="0"
    ></div>
  }

  @if (collapsed() === 'left' || collapsed() === 'none') {
    <div class="right-area">
      <ng-content select="[right]"></ng-content>
    </div>
  }
</div>
