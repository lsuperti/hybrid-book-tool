<div class="split-container" #splitContainer [style.--left-width.%]="this.collapsed() === 'left' ? 0 : this.collapsed() === 'right' ? 100 : this.leftWidth()">
  @if (this.collapsed() === 'right' || this.collapsed() === 'none') {
    <div class="left-area">
      <ng-content select="[left]"></ng-content>
    </div>
  }

  @if (this.collapsed() === 'none') {
    <div
    class="resize-bar"
    [style.--top-margin]="resizeBarTopMargin()"
    [style.--bottom-margin]="resizeBarBottomMargin()"
    (pointerdown)="resizeBarPointerDown($event)"
    (keydown)="resizeBarKeyDown($event)"
    role="separator"
    aria-orientation="vertical"
    [attr.aria-valuemin]="minWidthPercentage()"
    [attr.aria-valuemax]="100 - minWidthPercentage()"
    aria-valuenow="{{ leftWidth() }}"
    aria-label="{{ resizeBarAriaLabel() }}"
    tabindex="0"></div>
  }

  @if (this.collapsed() === 'left' || this.collapsed() === 'none') {
    <div class="right-area">
      <ng-content select="[right]"></ng-content>
    </div>
  }
</div>
