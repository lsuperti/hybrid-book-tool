<div class="split-container" #splitContainer [style.--left-width.%]="leftWidth()">
  <div class="left-area">
    <ng-content select="[left]"></ng-content>
  </div>
  <div
  class="resize-bar"
  [style.--top-margin]="resizeBarTopMargin()"
  [style.--bottom-margin]="resizeBarBottomMargin()"
  (pointerdown)="resizeBarPointerDown($event)"
  (keydown)="resizeBarKeyDown($event)"
  role="separator"
  aria-orientation="vertical"
  aria-valuenow="{{ leftWidth() }}"
  aria-label="{{ resizeBarAriaLabel() }}"
  tabindex="0"></div>
  <div class="right-area">
    <ng-content select="[right]"></ng-content>
  </div>
</div>
