<app-split
direction="vertical"
[defaultSize]="65"
[resizeBarAriaLabel]="'Redimensionamento das áreas de linha do tempo e de segmentos e visualização de vídeo'"
>
  <app-split
  first
  direction="horizontal"
  [resizeBarAriaLabel]="'Redimensionamento das áreas de segmentos e de visualização de vídeo'"
  >
    <div left class="video-segments-area">
      @if (mediaFilesService.mediaFiles().length <= 0) {
        <app-info-card
        class="info-card"
        [type]="'warning'"
        [message]="'Nenhum arquivo de mídia foi carregado.'"
        ></app-info-card>
      } @else {
        <div class="card video-segments-container">
          <ol class="video-segments-list">
            @for (segment of videoSegmentationService.segments(); track segment.id ?? $index; let i = $index) {
              <li class="video-segments-list-item" [aria-selected]="activeSegment()?.id === segment.id">
                <button
                class="video-segments-list-item-main-button"
                (click)="onSegmentSelected(segment)"
                [attr.aria-label]="'Selecionar segmento ' + segment.name"
                >
                  @if (segment.thumbnail) {
                    <div class="video-segment-thumbnail-container">
                      <img
                      inert
                      [src]="segment.thumbnail"
                      alt="Thumbnail de {{ segment.name }}"
                      class="segment-thumbnail"
                      />
                    </div>
                  } @else {
                    <div class="video-segment-thumbnail-container video-segment-thumbnail-placeholder">
                      <svg viewBox="0 0 576 384" version="1.1" xmlns="http://www.w3.org/2000/svg">
                        <path
                        style="fill:none;stroke:currentColor;stroke-width:32;stroke-linejoin:miter"
                        d="M 11.314,372.686 192,192 288,288 384,192 l 180.686,180.686"
                        />
                        <circle style="fill:currentColor;fill-rule:evenodd" cx="425.37299" cy="128" r="32" />
                      </svg>
                    </div>
                  }
                  <div class="segment-name-container">
                    <p class="segment-name">{{ segment.name }}</p>
                  </div>
                </button>
              </li>
            }
          </ol>
        </div>
      }
    </div>
    <div right class="video-preview-area">
      @if (mediaFilesService.mediaFiles().length <= 0) {
        <app-info-card
        class="info-card"
        [type]="'warning'"
        [message]="'Nenhum arquivo de mídia foi carregado.'"
        ></app-info-card>
      } @else {
        <div class="card video-preview-container">
          <app-video-player
          class="video-player"
          [mode]="'file'"
          [(currentTime)]="currentTime"
          [(isPlaying)]="isPlaying"
          [(isScrubbing)]="isScrubbing"
          [mediaFileId]="activeMediaFile()?.id ?? null"
          ></app-video-player>
        </div>
      }
    </div>
  </app-split>
  <app-timeline
  class="timeline card"
  second
  [(currentTime)]="currentTime"
  [(isPlaying)]="isPlaying"
  [(isScrubbing)]="isScrubbing"
  [(activeMediaFileId)]="activeMediaFileId"
  ></app-timeline>
</app-split>
